[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "cba_tools"
dynamic = ['version']
description = "Protein MD Simulation Setup Tools for CompBioAsia."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
license-files = ["LICENSE"]
keywords = [
    "compbioasia",
    "protein",
    "molecular dynamics",
    "simulation",
    "setup tools"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
authors = [
    {name = "Charlie Laughton", email = "charles.laughton@nottingham.ac.uk"},
    {name = "Bindu Koli", email = ""}
    ]
dependencies = [
    "numpy",
    "mdtraj",
    "rdkit",
    "crossflow"
]
[project.scripts]
yaspt = "cba_tools.cli_scripts:yaspt_cli"
mesmy = "cba_tools.cli_scripts:mesmy_cli"

[tool.hatch.metadata.hooks.custom]
